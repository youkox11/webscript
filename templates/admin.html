{% extends 'base.html' %}{% block content %}<div class="section-head"><div><div class="eyebrow">PRIVATE CONTROL CENTER</div><h1>Admin <span>Dashboard.</span></h1></div><form method="post" action="/logout"><button>Logout</button></form></div><section class="admin-panel"><h2>Add a Script</h2><form method="post" action="/admin/script" enctype="multipart/form-data" class="editor"><label>Script Name<input name="name" required placeholder="YOUKO HUB"></label><label>Roblox Game<input name="game" required placeholder="Steal An Egg"></label><label>Access Tier<select name="tier"><option>Free</option><option>Premium</option></select></label><label>Script Logo (PNG/JPG/WEBP, max 3 MB)<input type="file" name="logo" accept="image/png,image/jpeg,image/webp"></label><label class="wide">Description<input name="description" placeholder="Features and description"></label><label class="wide">Lua Script<textarea name="code" rows="5" required placeholder="Paste your Lua code here"></textarea></label><button class="primary">+ Publish Script</button></form></section><section class="admin-panel"><h2>Manage Scripts</h2>{% for s in scripts %}<details><summary>{{s.name}} · {{s.tier}} <span class="muted">Edit ▾</span></summary><form method="post" action="/admin/script" enctype="multipart/form-data" class="editor"><input type="hidden" name="id" value="{{s.id}}"><label>Name<input name="name" value="{{s.name}}" required></label><label>Game<input name="game" value="{{s.game}}" required></label><label>Tier<select name="tier"><option {% if s.tier=='Free' %}selected{% endif %}>Free</option><option {% if s.tier=='Premium' %}selected{% endif %}>Premium</option></select></label><label>Replace Logo<input type="file" name="logo" accept="image/png,image/jpeg,image/webp"></label><label class="wide">Description<input name="description" value="{{s.description}}"></label><label class="wide">Lua Script<textarea name="code" rows="4" required>{{s.code}}</textarea></label><button class="primary">Save Changes</button></form><form method="post" action="{{url_for('delete_script',sid=s.id)}}" onsubmit="return confirm('Delete this script?')"><button class="danger">Delete Script</button></form></details>{% else %}<p class="muted">No scripts yet.</p>{% endfor %}</section><section class="admin-panel"><h2>Owner Telegram Links</h2><form method="post" action="/admin/owners" class="editor">{% for o in owners %}<label>{{o.name}}<input name="owner_{{o.id}}" value="{{o.telegram}}" placeholder="Telegram username (without @)"></label>{% endfor %}<button class="primary">Save Telegram Links</button></form></section>{% endblock %}
