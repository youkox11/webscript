
name: Deploy YOUKO HUB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: youko-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub
        uses: actions/checkout@v4

      - name: Verify Python code
        run: |
          test -f app.py || {
            echo "Missing app.py in GitHub"
            exit 1
          }
          python3 -m py_compile app.py

      - name: Upload website files
        env:
          PA_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PA_TOKEN"

          BASE="https://www.pythonanywhere.com/api/v0/user/Youkox/files/path/home/Youkox/webscript"

          while IFS= read -r file; do
            case "$file" in
              app.py|templates/*.html|static/*.css|static/*.js|static/*.png|static/*.jpg|static/*.jpeg|static/*.webp)
                echo "Deploying: $file"
                curl --fail-with-body --silent --show-error \
                  --retry 3 \
                  -X POST \
                  -H "Authorization: Token $PA_TOKEN" \
                  -F "content=@${file}" \
                  "$BASE/$file"
                ;;
            esac
          done < <(git ls-files)

      - name: Reload Website
        env:
          PA_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Token $PA_TOKEN" \
            "https://www.pythonanywhere.com/api/v0/user/Youkox/webapps/youkox.pythonanywhere.com/reload/"
